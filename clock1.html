<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Daybreak Clock</title>
<meta name="theme-color" content="#07080a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#07080a;
    --text:#f2efe9;
    --text-dim:#a9b0b9;
    --text-faint:#6f7580;
    --accent:#ffb454;
    --accent-2:#6fb7ff;
    --scrim-top:rgba(4,5,7,.70);
    --scrim-bottom:rgba(4,5,7,.88);
    --card:rgba(255,255,255,.07);
    --card-border:rgba(255,255,255,.10);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .frame{
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  .bg-layer{
    position:absolute; inset:-3%;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity 2.4s ease, transform 220s linear;
    transform:scale(1);
    will-change:opacity, transform;
  }
  .bg-layer.active{opacity:1; transform:scale(1.08);}
  .bg-scrim{
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom, var(--scrim-top) 0%, rgba(4,5,7,.35) 30%, rgba(4,5,7,.40) 60%, var(--scrim-bottom) 100%);
    pointer-events:none;
  }
  .night-bg{
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 12%, #131a2c 0%, #0a0d16 45%, #05060a 100%);
    opacity:0;
    transition:opacity 2.4s ease;
  }
  .night-bg.active{opacity:1;}
  .stars{
    position:absolute; inset:0;
    opacity:.55;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 20%, #fff, transparent),
      radial-gradient(1px 1px at 28% 65%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 45% 30%, #fff, transparent),
      radial-gradient(1px 1px at 62% 78%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 15%, #fff, transparent),
      radial-gradient(1px 1px at 85% 55%, #fff, transparent),
      radial-gradient(1px 1px at 20% 88%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 95% 40%, #fff, transparent);
    background-repeat:no-repeat;
  }

  /* ---- mobile-first stage: sized for the A9 Pro's ~360x640 CSS viewport ---- */
  .stage{
    position:absolute; inset:0;
    padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px)) 16px;
    padding-top:calc(34px + env(safe-area-inset-top,0px));
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:14px;
    transition:transform 50s ease-in-out;
    will-change:transform;
  }
  .top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 11px;
    border-radius:100px;
    background:var(--card);
    border:1px solid var(--card-border);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-dim);
    backdrop-filter:blur(6px);
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}
  .weather-pill{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 14px 8px 10px;
    border-radius:100px;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(6px);
    flex:none;
  }
  .weather-pill svg{width:30px;height:30px;flex:none;color:var(--accent);}
  .weather-temp{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .weather-place{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .weather-text{display:flex; flex-direction:column; line-height:1.15;}

  .clock-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
    max-width:92vw;
  }
  .time-row{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    line-height:1;
    width:100%;
  }
  .time-main{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:clamp(52px, 24vw, 108px);
    letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 4px 30px rgba(0,0,0,.45);
    white-space:nowrap;
  }
  .time-ampm{
    color:var(--text-dim);
  }
  .sec-bar{
    --sec-color:#4ade80;
    display:flex;
    gap:1px;
    width:100%;
    height:6px;
    margin-top:2px;
  }
  .sec-bar i{
    flex:1 1 0;
    background:var(--sec-color);
    border-radius:1.5px;
    opacity:.92;
    transition:background-color .6s ease;
  }
  .sec-bar i.off{visibility:hidden;}
  .date-row{
    font-size:clamp(13px, 3.6vw, 17px);
    color:var(--text-dim);
    letter-spacing:.02em;
  }
  .period-note{
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:.05em;
    text-transform:uppercase;
  }

  .bottom-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .fc-card{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 14px 8px 10px;
    border-radius:100px;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(6px);
    flex:none;
    min-width:0;
  }
  .fc-card svg{width:30px;height:30px;flex:none;color:var(--accent-2);}
  .fc-info{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    min-width:0;
    line-height:1.15;
  }
  .fc-day{
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .fc-temps{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .fc-hi{color:var(--text); font-weight:600;}
  .fc-lo{color:var(--text-faint);}

  /* ---- enhance for tablets / laptops previewing the page ---- */
  @media (min-width:480px){
    .stage{
      padding:34px 42px calc(30px + env(safe-area-inset-bottom,0px)) 42px;
      padding-top:calc(68px + env(safe-area-inset-top,0px));
      gap:22px;
    }
    .tag{font-size:12px; padding:7px 13px; gap:8px;}
    .weather-pill{gap:16px; padding:14px 24px 14px 16px;}
    .weather-pill svg{width:46px;height:46px;}
    .weather-temp{font-size:33px;}
    .weather-place{font-size:14px;}
    .clock-wrap{gap:12px;}
    .time-row{gap:12px;}
    .time-main{font-size:clamp(96px, 27vw, 220px);}
    .time-ampm{font-size:clamp(22px, 5vw, 46px);}
    .date-row{font-size:clamp(16px, 3vw, 20px);}
    .period-note{font-size:12px;}
    .fc-card{gap:16px; padding:14px 24px 14px 16px;}
    .fc-card svg{width:46px;height:46px;}
    .fc-day{font-size:14px;}
    .fc-temps{font-size:26px;}
  }
  @media (prefers-reduced-motion:reduce){
    .bg-layer, .stage{transition:none;}
  }

  /* ================= adaptive sizing =================
     JS (fitLayout) measures the viewport and sets:
       --u        general scale (1 = 360px on the short side)
       --time-px  time font size, fitted to width AND height
       --ampm-px  AM/PM size
       --date-px  date size
     Everything below is derived from those, so the layout
     scales to any phone, tablet or orientation. */
  :root{ --u:1; --time-px:88px; --ampm-px:24px; --date-px:15px; }

  .stage{
    padding-top:calc(var(--u) * 26px + env(safe-area-inset-top,0px));
    padding-right:calc(var(--u) * 16px + env(safe-area-inset-right,0px));
    padding-bottom:calc(var(--u) * 16px + env(safe-area-inset-bottom,0px));
    padding-left:calc(var(--u) * 16px + env(safe-area-inset-left,0px));
    gap:calc(var(--u) * 14px);
  }
  .tag{font-size:calc(var(--u) * 10.5px); padding:calc(var(--u) * 6px) calc(var(--u) * 11px); gap:calc(var(--u) * 6px);}
  .tag .dot{width:calc(var(--u) * 6px); height:calc(var(--u) * 6px);}

  .weather-pill,.fc-card{
    gap:calc(var(--u) * 9px);
    padding:calc(var(--u) * 8px) calc(var(--u) * 14px) calc(var(--u) * 8px) calc(var(--u) * 10px);
  }
  .weather-pill svg,.fc-card svg{width:calc(var(--u) * 30px); height:calc(var(--u) * 30px);}
  .weather-temp{font-size:calc(var(--u) * 24px);}
  .weather-place{font-size:calc(var(--u) * 11px);}
  .fc-day{font-size:calc(var(--u) * 11px);}
  .fc-temps{font-size:calc(var(--u) * 20px);}

  .clock-wrap{gap:calc(var(--u) * 10px);}
  .time-row{gap:calc(var(--u) * 6px);}
  .time-main{font-size:var(--time-px);}
  .time-ampm{
    position:absolute;
    top:calc(var(--ampm-px) * -0.1);
    right:calc(var(--ampm-px) * -0.5);
    width:calc(var(--ampm-px) * 1.05);
    height:calc(var(--ampm-px) * 1.05);
    font-size:0;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.5));
    transition:color 1.2s ease;
  }
  .time-ampm svg{width:100%; height:100%; display:block;}
  .sec-bar{height:max(6px, calc(var(--u) * 6px)); margin-top:calc(var(--u) * 4px);}
  .date-row{font-size:var(--date-px);}
  .period-note{font-size:calc(var(--u) * 10.5px);}
</style>
</head>
<body>

<div class="frame" id="frame">
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
  <div class="night-bg" id="nightBg"><div class="stars"></div></div>
  <div class="bg-scrim"></div>

  <div class="stage" id="stage">
    <div class="top-row">
      <div class="tag"><span class="dot"></span><span id="periodTag">Loading</span></div>
    </div>

    <div class="clock-wrap">
      <div class="time-row">
        <span class="time-main" id="timeMain">12:00</span>
        <span class="time-ampm" id="timeAmpm" role="img" aria-label="Weather"></span>
      </div>
      <div class="sec-bar" id="secBar" aria-hidden="true"></div>
      <div class="date-row" id="dateRow">--</div>
      <div class="period-note" id="periodNote">--</div>
    </div>

    <div class="bottom-row">
      <div class="fc-card" id="todayCard">
        <span id="todayIcon"></span>
        <div class="fc-info">
          <span class="fc-day">Today</span>
          <span class="fc-temps"><span class="fc-hi" id="todayHi">--°</span> <span class="fc-lo" id="todayLo">--°</span></span>
        </div>
      </div>
      <div class="weather-pill">
        <span id="weatherIcon"></span>
        <div class="weather-text">
          <span class="weather-temp" id="weatherTemp">--°</span>
          <span class="weather-place" id="weatherPlace">--</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var LOCATION = { lat: 28.4089, lon: 77.3178, name: "Faridabad" };

  var CATEGORIES = [
    { start:7,  end:12, key:"religious", tag:"Morning · Sacred Places",
      queries:["temple architecture","cathedral interior","mosque architecture","monastery","buddhist temple","church stained glass"] },
    { start:12, end:17, key:"tourist", tag:"Afternoon · Landmarks",
      queries:["famous landmark","mountain viewpoint","historic city skyline","waterfall","desert landscape","ancient ruins"] },
    { start:17, end:20, key:"food", tag:"Evening · Food & Getaways",
      queries:["gourmet food","sunset beach","street food market","tropical resort","fine dining","seaside sunset"] },
    { start:20, end:22, key:"news", tag:"Night · World News",
      queries:["newspaper","press conference","world map","city skyline night","television news studio"] }
  ];

  var WEATHER_REFRESH_MS = 30 * 60 * 1000;
  var DRIFT_INTERVAL_MS = 60 * 1000;
  var DRIFT_RANGE_PX = 14;

  function pad(n){ return String(n).padStart(2,"0"); }
  function pick(arr, seed){ return arr[seed % arr.length]; }

  function getCategory(hour){
    for (var i=0;i<CATEGORIES.length;i++){
      var c = CATEGORIES[i];
      if (hour >= c.start && hour < c.end) return c;
    }
    return null;
  }

  var elMain = document.getElementById("timeMain");
  var elAmpm = document.getElementById("timeAmpm");
  var elDate = document.getElementById("dateRow");
  var elTag  = document.getElementById("periodTag");
  var elNote = document.getElementById("periodNote");

  var DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function tick(){
    var now = new Date();
    var h24 = now.getHours();
    var h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    elMain.textContent = h12 + ":" + pad(now.getMinutes());
    elDate.textContent = DAY_NAMES[now.getDay()] + ", " + now.getDate() + " " + MONTH_NAMES[now.getMonth()];
  }
  tick();
  // No seconds shown, so a 15s cadence keeps the minute display accurate
  // (worst case ~15s stale on the minute rollover) while doing less work
  // than a per-second tick on a screen that's always on.
  setInterval(tick, 15 * 1000);

  /* ---- seconds line: 60 segments, one disappears each second,
         full again when the next minute starts ---- */
  var secBar = document.getElementById("secBar");
  var secSegs = [];
  for (var s=0; s<60; s++){
    var seg = document.createElement("i");
    secBar.appendChild(seg);
    secSegs.push(seg);
  }
  // Colors step down every 15s of the minute, then reset to green at :00 —
  // a calm-to-urgent cue that's easy to read at a glance from across a room.
  var SEC_BAND_COLORS = ["#4ade80", "#fbbf24", "#fb923c", "#f87171"]; // green, amber, orange, red
  function secBandColor(remaining){
    if (remaining > 45) return SEC_BAND_COLORS[0];
    if (remaining > 30) return SEC_BAND_COLORS[1];
    if (remaining > 15) return SEC_BAND_COLORS[2];
    return SEC_BAND_COLORS[3];
  }
  function updateSecBar(){
    var sec = new Date().getSeconds();
    var remaining = 60 - sec; // 60 at :00 down to 1 at :59
    // sec 0 -> all 60 visible; sec 59 -> 1 visible
    for (var i=0; i<60; i++){
      secSegs[i].className = (i >= remaining) ? "off" : "";
    }
    secBar.style.setProperty("--sec-color", secBandColor(remaining));
  }
  function secLoop(){
    updateSecBar();
    tick();
    setTimeout(secLoop, 1000 - (Date.now() % 1000) + 5);
  }
  secLoop();

  var bgA = document.getElementById("bgA");
  var bgB = document.getElementById("bgB");
  var nightBg = document.getElementById("nightBg");
  var activeLayer = bgA;
  var lastFetchedKey = null;

  function setPeriodLabels(cat, hour){
    if (cat){
      elTag.textContent = cat.tag;
      elNote.textContent = "Wallpaper refreshes hourly";
    } else {
      elTag.textContent = "Overnight · Quiet Scene";
      elNote.textContent = "Dimmed for screen care";
    }
  }

  function showNightBackdrop(){
    nightBg.classList.add("active");
    bgA.classList.remove("active");
    bgB.classList.remove("active");
  }

  function swapToImage(url){
    var incoming = (activeLayer === bgA) ? bgB : bgA;
    var img = new Image();
    img.onload = function(){
      incoming.style.backgroundImage = "url('" + url + "')";
      nightBg.classList.remove("active");
      incoming.classList.add("active");
      activeLayer.classList.remove("active");
      activeLayer = incoming;
    };
    img.onerror = function(){ /* leave current wallpaper in place */ };
    img.src = url;
  }

  function fallbackGradientFor(key){
    var gradients = {
      religious: "radial-gradient(120% 90% at 50% 0%, #3a2a1e 0%, #14100c 60%, #07080a 100%)",
      tourist:   "radial-gradient(120% 90% at 50% 0%, #123a3f 0%, #0d1a1e 60%, #07080a 100%)",
      food:      "radial-gradient(120% 90% at 50% 0%, #3a1f16 0%, #1a100c 60%, #07080a 100%)",
      news:      "radial-gradient(120% 90% at 50% 0%, #1c2333 0%, #0e1119 60%, #07080a 100%)"
    };
    var incoming = (activeLayer === bgA) ? bgB : bgA;
    incoming.style.backgroundImage = "none";
    incoming.style.background = gradients[key] || gradients.tourist;
    nightBg.classList.remove("active");
    incoming.classList.add("active");
    activeLayer.classList.remove("active");
    activeLayer = incoming;
  }

  // Wikimedia Commons image search — free, keyless, explicitly supports
  // cross-origin calls from a browser (origin=* below), which is what
  // made the previous source (Openverse) unreliable: it now returns
  // 403 on plain anonymous requests.
  function fetchWallpaper(cat, hour){
    var q = pick(cat.queries, hour) + " filetype:bitmap";
    var url = "https://commons.wikimedia.org/w/api.php?action=query&format=json" +
              "&generator=search&gsrnamespace=6&gsrlimit=25&gsrsearch=" + encodeURIComponent(q) +
              "&prop=imageinfo&iiprop=url|mime&iiurlwidth=1600&origin=*";
    fetch(url)
      .then(function(r){ if(!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function(data){
        var pages = data && data.query && data.query.pages;
        if (!pages) throw new Error("no pages");
        var list = [];
        for (var k in pages){
          if (!pages.hasOwnProperty(k)) continue;
          var info = pages[k].imageinfo && pages[k].imageinfo[0];
          if (info && info.thumburl && /^image\/(jpeg|png|webp)/i.test(info.mime || "")){
            list.push(info.thumburl);
          }
        }
        if (!list.length) throw new Error("no usable images");
        swapToImage(list[Math.floor(Math.random() * list.length)]);
      })
      .catch(function(){ fallbackGradientFor(cat.key); });
  }

  function refreshWallpaperIfNeeded(){
    var now = new Date();
    var hour = now.getHours();
    var cat = getCategory(hour);
    setPeriodLabels(cat, hour);

    if (!cat){
      showNightBackdrop();
      lastFetchedKey = "night";
      return;
    }

    var hourKey = cat.key + "-" + now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate() + "-" + hour;
    if (hourKey === lastFetchedKey) return;
    lastFetchedKey = hourKey;
    fetchWallpaper(cat, hour);
  }

  refreshWallpaperIfNeeded();
  setInterval(refreshWallpaperIfNeeded, 60 * 1000);

  var WMO_ICONS = {
    clear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.6"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" stroke-linecap="round"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 18a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 16.6 8.3 4.5 4.5 0 0 1 16 18H6.5Z" stroke-linejoin="round"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 14.5a4 4 0 0 1-.4-7.97A5.5 5.5 0 0 1 16.6 4.8 4.5 4.5 0 0 1 16 14.5H6.5Z" stroke-linejoin="round"/><path d="M8 17.5 7 20M12 17.5l-1 2.5M16 17.5l-1 2.5" stroke-linecap="round"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 13.5a4 4 0 0 1-.4-7.97A5.5 5.5 0 0 1 16.6 3.8 4.5 4.5 0 0 1 16 13.5H6.5Z" stroke-linejoin="round"/><path d="M9 17v4M7 18.5l4 1M11 18.5l-4 1M15 17v4M13 18.5l4 1M17 18.5l-4 1" stroke-linecap="round"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 13a4 4 0 0 1-.4-7.97A5.5 5.5 0 0 1 16.6 3.3 4.5 4.5 0 0 1 16 13H6.5Z" stroke-linejoin="round"/><path d="M13 13.5 10 18h3l-2 4" stroke-linejoin="round" stroke-linecap="round"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 9h9M3 12.5h14M6 16h11" stroke-linecap="round"/></svg>',
    night: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7.2" fill="currentColor" stroke="none"/><circle cx="9.3" cy="9" r="1.15" fill="rgba(0,0,0,.16)" stroke="none"/><circle cx="14.2" cy="8.4" r="0.8" fill="rgba(0,0,0,.13)" stroke="none"/><circle cx="13.6" cy="14.3" r="1.5" fill="rgba(0,0,0,.16)" stroke="none"/><circle cx="9.5" cy="15.2" r="0.7" fill="rgba(0,0,0,.13)" stroke="none"/></svg>',
    cloudySun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="7.5" r="3"/><path d="M8 2.3v1.5M8 11.7v1M3.3 7.5h1.3M11.7 7.5h1M4.7 4.2l.9.9M10.4 10l.9.9M11.3 4.2l-.9.9"/><path d="M9.3 19.3a4.3 4.3 0 0 1-.4-8.55 5.9 5.9 0 0 1 10.9 2.25 4.8 4.8 0 0 1-.5 6.3H9.3Z"/></svg>',
    cloudyMoon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.2" cy="7" r="3.35" fill="currentColor" stroke="none"/><circle cx="11.8" cy="5.7" r="0.55" fill="rgba(0,0,0,.16)" stroke="none"/><circle cx="14.5" cy="8.1" r="0.7" fill="rgba(0,0,0,.16)" stroke="none"/><path d="M8.8 19.3a4.3 4.3 0 0 1-.4-8.55A5.9 5.9 0 0 1 19 12.7a4.8 4.8 0 0 1-.5 6.6H8.8Z"/></svg>'
  };

  function iconForCode(code, isDay){
    if (code === 0) return isDay ? WMO_ICONS.clear : WMO_ICONS.night;
    if ([1,2,3].indexOf(code) > -1) return WMO_ICONS.cloud;
    if ([45,48].indexOf(code) > -1) return WMO_ICONS.fog;
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82].indexOf(code) > -1) return WMO_ICONS.rain;
    if ([71,73,75,77,85,86].indexOf(code) > -1) return WMO_ICONS.snow;
    if ([95,96,99].indexOf(code) > -1) return WMO_ICONS.storm;
    return WMO_ICONS.cloud;
  }

  /* ---- weather icon shown above the time, colored by temperature ----
     0–15°: white/cream · 15–25°: blue · 25–30°: orange · 30°+: red */
  function tempColor(t){
    if (t === null || t === undefined || isNaN(t)) return "#f2efe9";
    if (t < 15) return "#f2efe9";
    if (t < 25) return "#6fb7ff";
    if (t < 30) return "#fb923c";
    return "#ef4444";
  }
  function weatherIconKind(code, isDay){
    if (code === 0) return isDay ? "clear" : "night";
    if ([1,2,3].indexOf(code) > -1) return isDay ? "cloudySun" : "cloudyMoon";
    if ([45,48].indexOf(code) > -1) return isDay ? "cloudySun" : "cloudyMoon";
    if ([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].indexOf(code) > -1) return "rain";
    if ([71,73,75,77,85,86].indexOf(code) > -1) return "snow";
    return isDay ? "cloudySun" : "cloudyMoon";
  }
  var timeIconState = { code: null, isDay: null, temp: null };
  function updateTimeIcon(){
    var isDay = (timeIconState.isDay !== null) ? timeIconState.isDay :
      (new Date().getHours() >= 6 && new Date().getHours() < 18);
    var code = (timeIconState.code !== null) ? timeIconState.code : 0;
    var kind = weatherIconKind(code, isDay);
    elAmpm.innerHTML = WMO_ICONS[kind];
    elAmpm.style.color = tempColor(timeIconState.temp);
    elAmpm.setAttribute("aria-label", kind + (timeIconState.temp !== null ? ", " + Math.round(timeIconState.temp) + " degrees" : ""));
  }
  updateTimeIcon();
  setInterval(updateTimeIcon, 60 * 1000);

  var elWIcon = document.getElementById("weatherIcon");
  var elWTemp = document.getElementById("weatherTemp");
  var elWPlace = document.getElementById("weatherPlace");
  var elTodayIcon = document.getElementById("todayIcon");
  var elTodayHi = document.getElementById("todayHi");
  var elTodayLo = document.getElementById("todayLo");

  function renderToday(daily){
    if (!daily.time.length) return;
    elTodayIcon.innerHTML = iconForCode(daily.weather_code[0], true);
    elTodayHi.textContent = Math.round(daily.temperature_2m_max[0]) + "°";
    elTodayLo.textContent = Math.round(daily.temperature_2m_min[0]) + "°";
  }

  function fetchWeather(){
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + LOCATION.lat +
              "&longitude=" + LOCATION.lon +
              "&current=temperature_2m,weather_code,is_day" +
              "&daily=temperature_2m_max,temperature_2m_min,weather_code" +
              "&timezone=auto&forecast_days=1";
    fetch(url)
      .then(function(r){ if(!r.ok) throw new Error("bad response"); return r.json(); })
      .then(function(data){
        if (data.current){
          elWIcon.innerHTML = iconForCode(data.current.weather_code, data.current.is_day === 1);
          elWTemp.textContent = Math.round(data.current.temperature_2m) + "°C";
          timeIconState.code = data.current.weather_code;
          timeIconState.isDay = data.current.is_day === 1;
          timeIconState.temp = data.current.temperature_2m;
          updateTimeIcon();
        }
        elWPlace.textContent = LOCATION.name;
        if (data.daily) renderToday(data.daily);
      })
      .catch(function(){
        elWTemp.textContent = "--°C";
        elWPlace.textContent = LOCATION.name;
      });
  }

  fetchWeather();
  setInterval(fetchWeather, WEATHER_REFRESH_MS);

  if (navigator.geolocation){
    try{
      navigator.geolocation.getCurrentPosition(function(pos){
        LOCATION = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: "Current location" };
        fetchWeather();
      }, function(){ /* keep default */ }, { timeout: 4000, maximumAge: 3600000 });
    }catch(e){ /* keep default */ }
  }

  /* ============ adapt layout to the screen ============ */
  var layoutScale = 1;
  function fitLayout(){
    var de = document.documentElement;
    var w = window.innerWidth  || de.clientWidth;
    var h = window.innerHeight || de.clientHeight;
    var landscape = w > h;

    // General scale: 1.0 at 360px on the short side, clamped to sane bounds.
    var u = Math.max(0.8, Math.min(3.5, Math.min(w, h) / 360));
    layoutScale = u;

    // Time: "12:00" needs ~3.1em of width now that the day/night dot sits
    // above it instead of taking up row width; keep it within the
    // available width, and within a share of the height (more headroom
    // in landscape, where height is no longer the tight constraint).
    var availW = w - 32 * u;   // width left inside the stage padding
    var timePx = Math.min(w * 0.37, availW / 2.85, h * (landscape ? 0.62 : 0.42), 520);
    var ampmPx = timePx * 0.28;

    // Date: scale with u but never wider than the screen.
    var datePx = Math.min(15 * u, w * 0.06);

    var s = de.style;
    s.setProperty("--u", u.toFixed(3));
    s.setProperty("--time-px", timePx.toFixed(1) + "px");
    s.setProperty("--ampm-px", ampmPx.toFixed(1) + "px");
    s.setProperty("--date-px", datePx.toFixed(1) + "px");
  }
  fitLayout();
  window.addEventListener("resize", fitLayout);
  window.addEventListener("orientationchange", function(){ setTimeout(fitLayout, 250); });
  document.addEventListener("fullscreenchange", function(){ setTimeout(fitLayout, 150); });
  document.addEventListener("webkitfullscreenchange", function(){ setTimeout(fitLayout, 150); });

  var stage = document.getElementById("stage");
  function driftContent(){
    var range = DRIFT_RANGE_PX * layoutScale;
    var x = (Math.random() * range * 2 - range).toFixed(1);
    var y = (Math.random() * range * 2 - range).toFixed(1);
    stage.style.transform = "translate(" + x + "px," + y + "px)";
  }
  driftContent();
  setInterval(driftContent, DRIFT_INTERVAL_MS);

  if ("wakeLock" in navigator){
    var requestWakeLock = function(){
      navigator.wakeLock.request("screen").catch(function(){});
    };
    requestWakeLock();
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible") requestWakeLock();
    });
  }

  /* ============ tap anywhere to toggle full screen ============ */
  var docEl = document.documentElement;

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function enterFullscreen(){
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    if (req){
      try{
        var p = req.call(docEl);
        if (p && p.catch) p.catch(function(){});
      }catch(e){}
    }
    if (screen.orientation && screen.orientation.lock){
      screen.orientation.lock("any").catch(function(){});
    }
  }

  function exitFullscreen(){
    var ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) ex.call(document).catch(function(){});
  }

  function toggleFullscreen(){
    if (isFullscreen()){
      try{ localStorage.setItem("clockWantFS","0"); }catch(e){}
      exitFullscreen();
    } else {
      try{ localStorage.setItem("clockWantFS","1"); }catch(e){}
      enterFullscreen();
    }
  }

  // A single "click" is enough — Chrome fires it for both touch and
  // mouse taps (the viewport meta already disables the old 300ms
  // touch delay), so listening to touchend as well would double-fire
  // the toggle on a real touchscreen tap. Tap anywhere to drop to
  // windowed mode; tap again to return to full screen.
  document.addEventListener("click", toggleFullscreen);

  // Full screen is the default. It only turns off if you've explicitly
  // tapped out of it (stored below), so a reload or the 5-minute
  // auto-refresh comes back full screen rather than windowed.
  var wantFS = true;
  try{ if (localStorage.getItem("clockWantFS") === "0") wantFS = false; }catch(e){}
  if (wantFS && !isFullscreen()){
    enterFullscreen();
  }
  })();
</script>

<script>
/* ============ auto-reload when the hosted copy changes ============ */
/* Checks this same URL every 5 minutes for changes (e.g. pushed to
   GitHub Pages) and reloads only when the content actually differs.
   If the network or the host is unreachable, it does nothing and tries
   again next cycle — the clock, date and last-known weather stay on
   screen and keep working entirely offline in the meantime. */
(function () {
  "use strict";
  if (!/^https?:$/.test(location.protocol)) return; // skip for a local file:// copy

  var CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
  var FETCH_TIMEOUT_MS = 10 * 1000;
  var baselineText = null;

  function fetchSelf(){
    var controller = ("AbortController" in window) ? new AbortController() : null;
    var timer = controller ? setTimeout(function(){ controller.abort(); }, FETCH_TIMEOUT_MS) : null;
    return fetch(location.href, {
      cache: "no-store",
      signal: controller ? controller.signal : undefined
    }).then(function(r){
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error("bad status");
      // Prefer the server's ETag / Last-Modified as the "version"; fall back
      // to the page text. Avoids false-positive reloads (which drop full screen).
      var tag = r.headers.get("etag") || r.headers.get("last-modified");
      return tag ? Promise.resolve("v:" + tag) : r.text();
    }).catch(function(err){
      if (timer) clearTimeout(timer);
      throw err;
    });
  }

  // Establish a baseline shortly after load, from the server's copy
  // rather than the live (browser-normalized) DOM.
  setTimeout(function(){
    fetchSelf().then(function(text){ baselineText = text; }).catch(function(){
      // No network at startup — fine, we'll pick up a baseline later.
    });
  }, 3000);

  setInterval(function(){
    fetchSelf().then(function(text){
      if (baselineText === null){ baselineText = text; return; }
      if (text !== baselineText) location.reload();
    }).catch(function(){
      // Offline or the host is unreachable: change nothing, just retry
      // on the next interval. The clock keeps running locally either way.
    });
  }, CHECK_INTERVAL_MS);
})();
</script>
